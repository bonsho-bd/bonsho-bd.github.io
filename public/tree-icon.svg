<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .fig { fill: #059669; }
    .acc { fill: #047857; }
  </style>

  <!-- Father -->
  <g transform="translate(-3, -2)">
    <circle cx="25" cy="25" r="6" class="fig"/>
    <!-- Kufi -->
    <path d="M 19 23 C 19 16, 31 16, 31 23 Z" class="acc"/>
    <!-- Body -->
    <path d="M 18 35 C 18 35, 25 31, 32 35 L 29 90 L 26 90 L 25 60 L 24 90 L 21 90 Z" class="fig"/>
  </g>

  <!-- Mother -->
  <g transform="translate(3, -2)">
    <!-- Hijab -->
    <path d="M 68 25 C 68 13, 82 13, 82 25 C 82 35, 77 40, 75 48 C 73 40, 68 35, 68 25 Z" class="acc"/>
    <circle cx="75" cy="25" r="4.5" fill="#fff"/>
    <circle cx="75" cy="25" r="4.5" class="fig"/> 
    <!-- Body -->
    <path d="M 68 46 C 68 46, 75 42, 82 46 L 79 90 L 76 90 L 75 60 L 74 90 L 71 90 Z" class="fig"/>
  </g>

  <!-- Child 1 (Younger Boy) -->
  <g transform="translate(-1, 5)">
    <circle cx="42" cy="45" r="4.5" class="fig"/>
    <!-- Kufi -->
    <path d="M 37.5 43 C 37.5 37, 46.5 37, 46.5 43 Z" class="acc"/>
    <path d="M 38 53 C 38 53, 42 49, 46 53 L 44 90 L 42.5 90 L 42 70 L 41.5 90 L 40 90 Z" class="fig"/>
  </g>

  <!-- Child 2 (Older Girl with Hijab) -->
  <g transform="translate(1, -2)">
    <path d="M 52.5 38 C 52.5 28, 63.5 28, 63.5 38 C 63.5 45, 59 49, 58 54 C 57 49, 52.5 45, 52.5 38 Z" class="acc"/>
    <circle cx="58" cy="38" r="3.5" fill="#fff"/>
    <circle cx="58" cy="38" r="3.5" class="fig"/>
    <path d="M 53 53 C 53 53, 58 50, 63 53 L 61 90 L 59 90 L 58 65 L 57 90 L 55 90 Z" class="fig"/>
  </g>
</svg>
