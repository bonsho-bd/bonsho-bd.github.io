<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>বংশ (Bonsho)</title>
    <script type="text/javascript">
      // GitHub Pages Single Page App Redirect
      // Preserves /view/qr-v0/<data> routes and forwards to index.html
      var l = window.location;
      var target = l.pathname + l.search + l.hash;
      l.replace(l.origin + '/?redirect=' + encodeURIComponent(target));
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <p>ফ্যামিলি ট্রি লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
  </body>
</html>
